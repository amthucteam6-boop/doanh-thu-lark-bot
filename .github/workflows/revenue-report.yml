name: Revenue Report to Lark

on:
  schedule:
    - cron: '0 5 * * *'   # 12:00 giờ Việt Nam (Trưa)
    - cron: '0 10 * * *'  # 17:00 giờ Việt Nam (Chiều)
    - cron: '0 14 * * *'  # 21:00 giờ Việt Nam (Tối)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Chạy thử thủ công: trua / chieu / toi'
        required: false
        default: 'now'

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Xác định khung giờ
        id: pick-slot
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            echo "slot=${{ github.event.inputs.slot }}" >> "$GITHUB_OUTPUT"
          else
            HOUR_UTC=$(date -u +%H)
            case "$HOUR_UTC" in
              05) echo "slot=trua" >> "$GITHUB_OUTPUT" ;;
              10) echo "slot=chieu" >> "$GITHUB_OUTPUT" ;;
              *) echo "slot=toi" >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gửi báo cáo
        env:
          SLOT: ${{ steps.pick-slot.outputs.slot }}
          CUKCUK_BPP_SECRET: ${{ secrets.CUKCUK_BPP_SECRET }}
          CUKCUK_WAJI_SECRET: ${{ secrets.CUKCUK_WAJI_SECRET }}
          CUKCUK_39BEEF_SECRET: ${{ secrets.CUKCUK_39BEEF_SECRET }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
        run: python3 report.py
