name: Revenue Report - Toi (22h VN)

on:
  # Lịch tự động ĐÃ TẮT — launchd local là kênh chính (chạy đúng giờ hơn nhiều).
  # Bật lại bằng cách bỏ comment 2 dòng dưới nếu cần dùng làm dự phòng.
  # schedule:
  #   - cron: '0 15 * * *'  # 22:00 giờ Việt Nam
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gửi báo cáo
        env:
          SLOT: toi
          CUKCUK_BPP_SECRET: ${{ secrets.CUKCUK_BPP_SECRET }}
          CUKCUK_WAJI_SECRET: ${{ secrets.CUKCUK_WAJI_SECRET }}
          CUKCUK_39BEEF_SECRET: ${{ secrets.CUKCUK_39BEEF_SECRET }}
          LARK_APP_ID: ${{ secrets.LARK_APP_ID }}
          LARK_APP_SECRET: ${{ secrets.LARK_APP_SECRET }}
          LARK_CHAT_ID: ${{ secrets.LARK_CHAT_ID }}
        run: python3 report.py
